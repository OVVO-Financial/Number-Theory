name: Number Theory hybrid research

on:
  pull_request:
    paths:
      - 'Prime Factorization/hybrid_research/**'
      - 'julia/complex_space_factorization.cpp'
      - '.github/workflows/number-theory-hybrid.yml'
  workflow_dispatch:

jobs:
  gmp-research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libgmp-dev libgmpxx4ldbl build-essential
      - name: Install reference-test dependencies
        run: python -m pip install sympy==1.13.3
      - name: Build unified C++ factorizer and test factor-five path
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra julia/complex_space_factorization.cpp -lgmpxx -lgmp -pthread -o /tmp/nt_complex_space
          /tmp/nt_complex_space --selftest
          /tmp/nt_complex_space 51505 --rsa --only=vf --b1=0 --verbose
      - name: Run bounded exact mathematical and GMP regression tests
        working-directory: Prime Factorization/hybrid_research
        run: |
          make -C naive_grouping_gmp check
          make -C global_vertical_locator test
          make -C vertical_relation_lab test
          make -C iterated_average_vertical_bridge test
          make -C dyadic_global_attack test
