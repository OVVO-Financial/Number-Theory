[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vf-factor-lab"
version = "0.4.0"
description = "Unified complete-sieve Fermat and iterated-average polynomial factorization"
requires-python = ">=3.10"
dependencies = ["python-flint==0.9.0"]

[project.optional-dependencies]
test = ["pytest>=8", "sympy>=1.13"]
report = ["matplotlib>=3.8"]

[project.scripts]
vf-factor = "vf_factor.fused:main"
vf-factor-compare = "vf_factor.cli:main"

[tool.setuptools.packages.find]
include = ["vf_factor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
